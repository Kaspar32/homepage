<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

      :root {
        --ink: #f4f1ea;
        --muted: #a7aaa5;
        --line: rgba(244, 241, 234, 0.2);
        --accent: #d3ff5c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #101211;
        color: var(--ink);
        font-family: 'Space Grotesk', sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(circle at 50% 45%, rgba(211, 255, 92, 0.1), transparent 34%), linear-gradient(135deg, #171b19, #0b0d0c 60%, #171a18);
        content: '';
      }

      canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        touch-action: none;
      }

      header {
        position: fixed;
        top: 0;
        left: 50%;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(1180px, calc(100% - 48px));
        padding: 24px 0;
        border-bottom: 1px solid var(--line);
        transform: translateX(-50%);
      }

      .brand {
        color: var(--ink);
        font-family: 'DM Mono', monospace;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .brand::before {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 10px;
        border-radius: 50%;
        background: var(--accent);
        content: '';
        box-shadow: 0 0 14px var(--accent);
      }

      header nav {
        display: flex;
        gap: 8px;
      }

      .Glas {
        padding: 10px 15px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font: 500 0.9rem 'Space Grotesk', sans-serif;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .Glas:hover,
      .Glas:focus-within {
        border-color: var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--accent);
      }

      header nav a {
        color: inherit;
        text-decoration: none;
      }

      .intro {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 1;
        width: min(900px, calc(100% - 48px));
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .intro-label {
        color: var(--accent);
        font-family: 'DM Mono', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .intro h1 {
        max-width: 760px;
        margin: 18px 0 24px;
        font-size: clamp(4rem, 11vw, 9.5rem);
        font-weight: 600;
        letter-spacing: -0.08em;
        line-height: 0.82;
      }

      .intro h1 span {
        color: var(--accent);
      }

      .intro p {
        max-width: 340px;
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      footer {
        position: fixed;
        right: 24px;
        bottom: 22px;
        z-index: 2;
        color: var(--muted);
        font: 0.7rem 'DM Mono', monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        header {
          width: calc(100% - 32px);
          padding: 18px 0;
        }

        .intro {
          width: calc(100% - 32px);
        }

        .intro h1 {
          font-size: clamp(3.8rem, 19vw, 6rem);
        }

        .Glas {
          padding: 8px 10px;
        }

        footer {
          right: 16px;
          bottom: 16px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <a class="brand" href="index.html">Portfolio / 01</a>
      <nav>
        <button class="Glas">
          <a href="home.html">About me</a>
        </button>

        <button class="Glas">
          <a href="links.html">Links</a>
        </button>
      </nav>
    </header>

    <main class="intro">
      <span class="intro-label">Digital playground / 2026</span>
      <h1>Make it<br><span>move.</span></h1>
      <p>A small space for experiments in code, design, motion and sound.</p>
    </main>

    <canvas id="c"></canvas>
    <footer>Move through the field / click to release</footer>
    <script>
      (() => {
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const pointer = { x: innerWidth / 2, y: innerHeight / 2, px: innerWidth / 2, py: innerHeight / 2, active: false };
        const sphere = [];
        const dye = [];
        let width = innerWidth;
        let height = innerHeight;
        let radius = 240;

        function resize() {
          const pixelRatio = Math.min(devicePixelRatio, 2);
          width = innerWidth;
          height = innerHeight;
          canvas.width = width * pixelRatio;
          canvas.height = height * pixelRatio;
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
          radius = Math.min(width, height) * (width < 600 ? 0.27 : 0.23);
          initSphere();
        }

        function initSphere() {
          sphere.length = 0;
          const count = width < 600 ? 260 : 520;
          for (let i = 0; i < count; i += 1) {
            const phi = Math.acos(1 - (2 * (i + 0.5)) / count);
            const theta = Math.PI * (1 + Math.sqrt(5)) * i;
            const depth = Math.cos(phi);
            sphere.push({
              x: Math.cos(theta) * Math.sin(phi),
              y: Math.sin(theta) * Math.sin(phi),
              z: depth,
              size: 0.8 + (depth + 1) * 1.15,
              phase: Math.random() * Math.PI * 2,
            });
          }
        }

        function addDye(x, y, forceX, forceY) {
          const amount = width < 600 ? 8 : 13;
          for (let i = 0; i < amount; i += 1) {
            dye.push({
              x: x + (Math.random() - 0.5) * 24,
              y: y + (Math.random() - 0.5) * 24,
              vx: forceX * (0.35 + Math.random() * 0.7),
              vy: forceY * (0.35 + Math.random() * 0.7),
              life: 1,
              size: 25 + Math.random() * 45,
              hue: 65 + Math.random() * 45,
            });
          }
          if (dye.length > 240) dye.splice(0, dye.length - 240);
        }

        function movePointer(event) {
          const point = event.touches ? event.touches[0] : event;
          const nextX = point.clientX;
          const nextY = point.clientY;
          const dx = nextX - pointer.x;
          const dy = nextY - pointer.y;
          pointer.px = pointer.x;
          pointer.py = pointer.y;
          pointer.x = nextX;
          pointer.y = nextY;
          pointer.active = true;
          if (Math.abs(dx) + Math.abs(dy) > 0) addDye(nextX, nextY, dx * 0.9, dy * 0.9);
        }

        function releaseField() {
          addDye(pointer.x, pointer.y, (Math.random() - 0.5) * 24, (Math.random() - 0.5) * 24);
          sphere.forEach((point) => {
            point.x += (Math.random() - 0.5) * 0.18;
            point.y += (Math.random() - 0.5) * 0.18;
          });
        }

        function animate(time) {
          const cx = width / 2;
          const cy = height / 2;
          ctx.fillStyle = "rgba(10, 12, 11, 0.22)";
          ctx.fillRect(0, 0, width, height);

          ctx.globalCompositeOperation = "screen";
          dye.forEach((drop, index) => {
            drop.x += drop.vx;
            drop.y += drop.vy;
            drop.vx *= 0.965;
            drop.vy *= 0.965;
            drop.life *= 0.975;
            const gradient = ctx.createRadialGradient(drop.x, drop.y, 0, drop.x, drop.y, drop.size);
            gradient.addColorStop(0, `hsla(${drop.hue}, 100%, 70%, ${drop.life * 0.18})`);
            gradient.addColorStop(1, `hsla(${drop.hue}, 100%, 55%, 0)`);
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(drop.x, drop.y, drop.size, 0, Math.PI * 2);
            ctx.fill();
            if (drop.life < 0.02) dye.splice(index, 1);
          });

          const scale = 1 + Math.sin(time * 0.0007) * 0.025;
          const rotation = time * 0.00012;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(scale, scale);
          sphere.forEach((point) => {
            const angle = rotation + point.z * 0.35;
            const rotatedX = point.x * Math.cos(angle) - point.z * Math.sin(angle);
            const rotatedZ = point.x * Math.sin(angle) + point.z * Math.cos(angle);
            const pulse = 0.82 + Math.sin(time * 0.0015 + point.phase) * 0.18;
            const alpha = Math.max(0.08, 0.22 + rotatedZ * 0.7) * pulse;
            const x = rotatedX * radius;
            const y = point.y * radius * 0.94;
            ctx.fillStyle = `rgba(232, 255, 164, ${alpha})`;
            ctx.beginPath();
            ctx.arc(x, y, point.size * (0.7 + rotatedZ * 0.45), 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
          ctx.globalCompositeOperation = "source-over";
          pointer.active = false;
          requestAnimationFrame(animate);
        }

        canvas.addEventListener("pointermove", movePointer);
        canvas.addEventListener("pointerdown", releaseField);
        canvas.addEventListener("touchmove", (event) => { event.preventDefault(); movePointer(event); }, { passive: false });
        window.addEventListener("resize", resize);
        resize();
        addDye(width * 0.3, height * 0.55, 8, -2);
        requestAnimationFrame(animate);
      })();
    </script>

  </body>
</html>
