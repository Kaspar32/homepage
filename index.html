<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

      :root {
        --ink: #f4f1ea;
        --muted: #a7aaa5;
        --line: rgba(244, 241, 234, 0.2);
        --accent: #d3ff5c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #101211;
        color: var(--ink);
        font-family: 'Space Grotesk', sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(circle at 50% 45%, rgba(211, 255, 92, 0.1), transparent 34%), linear-gradient(135deg, #171b19, #0b0d0c 60%, #171a18);
        content: '';
      }

      canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100vw;
        height: 100vh;
      }

      header {
        position: fixed;
        top: 0;
        left: 50%;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(1180px, calc(100% - 48px));
        padding: 24px 0;
        border-bottom: 1px solid var(--line);
        transform: translateX(-50%);
      }

      .brand {
        color: var(--ink);
        font-family: 'DM Mono', monospace;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .brand::before {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 10px;
        border-radius: 50%;
        background: var(--accent);
        content: '';
        box-shadow: 0 0 14px var(--accent);
      }

      header nav {
        display: flex;
        gap: 8px;
      }

      .Glas {
        padding: 10px 15px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font: 500 0.9rem 'Space Grotesk', sans-serif;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .Glas:hover,
      .Glas:focus-within {
        border-color: var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--accent);
      }

      header nav a {
        color: inherit;
        text-decoration: none;
      }

      .intro {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 1;
        width: min(900px, calc(100% - 48px));
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .intro-label {
        color: var(--accent);
        font-family: 'DM Mono', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .intro h1 {
        max-width: 760px;
        margin: 18px 0 24px;
        font-size: clamp(4rem, 11vw, 9.5rem);
        font-weight: 600;
        letter-spacing: -0.08em;
        line-height: 0.82;
      }

      .intro h1 span {
        color: var(--accent);
      }

      .intro p {
        max-width: 340px;
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      footer {
        position: fixed;
        right: 24px;
        bottom: 22px;
        z-index: 2;
        color: var(--muted);
        font: 0.7rem 'DM Mono', monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        header {
          width: calc(100% - 32px);
          padding: 18px 0;
        }

        .intro {
          width: calc(100% - 32px);
        }

        .intro h1 {
          font-size: clamp(3.8rem, 19vw, 6rem);
        }

        .Glas {
          padding: 8px 10px;
        }

        footer {
          right: 16px;
          bottom: 16px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <a class="brand" href="index.html">Portfolio / 01</a>
      <nav>
        <button class="Glas">
          <a href="home.html">About me</a>
        </button>

        <button class="Glas">
          <a href="links.html">Links</a>
        </button>
      </nav>
    </header>

    <main class="intro">
      <span class="intro-label">Digital playground / 2026</span>
      <h1>Make it<br><span>move.</span></h1>
      <p>A small space for experiments in code, design, motion and sound.</p>
    </main>

    <canvas id="c"></canvas>
    <footer>Click anywhere to disturb the field</footer>
    <script>
      (() => {
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");

        resize();
        window.addEventListener("resize", resize);

        function resize() {
          canvas.width = innerWidth;
          canvas.height = innerHeight;
        }

        const PARTICLE_COUNT = 500;
        const RADIUS = Math.min(innerWidth, innerHeight) * 0.35;
        const particles = [];

        function initSphere() {
          particles.length = 0;
          const cx = innerWidth / 2;
          const cy = innerHeight / 2;

          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const phi = Math.acos(1 - (2 * (i + 0.5)) / PARTICLE_COUNT);
            const theta = Math.PI * (1 + Math.sqrt(5)) * (i + 0.5);

            const x = Math.cos(theta) * Math.sin(phi);
            const y = Math.sin(theta) * Math.sin(phi);
            const z = Math.cos(phi);

            const homeX = cx + x * RADIUS;
            const homeY = cy + y * RADIUS;

            const vx = (Math.random() - 0.5) * 2;
            const vy = (Math.random() - 0.5) * 2;

            // Blinken: Phase und Geschwindigkeit
            const blinkSpeed = 0.002 + Math.random() * 0.004; // wie schnell
            const blinkOffset = Math.random() * Math.PI * 2; // Startphase

            particles.push({
              x: homeX,
              y: homeY,
              homeX,
              homeY,
              vx,
              vy,
              returning: true,
              blinkSpeed,
              blinkOffset,
            });
          }
        }

        initSphere();

        const EXPLOSION_SPEED = 400;
        const EXPLOSION_DURATION = 800;
        const SPRING = 0.02;
        const DAMPING = 0.88;
        const FRICTION = 0.98;
        let lastExplosion = 0;

        function explode(cx, cy) {
          const now = performance.now();
          lastExplosion = now;

          for (let p of particles) {
            const dx = p.x - cx;
            const dy = p.y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;

            const nx = dx / dist;
            const ny = dy / dist;

            const speed = EXPLOSION_SPEED * (0.5 + Math.random());
            p.vx = nx * speed * 0.016;
            p.vy = ny * speed * 0.016;
            p.returning = false;
          }

          setTimeout(() => {
            if (lastExplosion === now) {
              for (let p of particles) {
                p.returning = true;
              }
            }
          }, EXPLOSION_DURATION);
        }

        canvas.addEventListener("pointerdown", (e) => {
          explode(e.clientX, e.clientY);
        });

        function animate(time) {
          ctx.fillStyle = "black";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Butterfly
          let x = 400 * Math.pow(Math.sin((time * 1) / 1000), 2) + 150;
          let y = 150;

          ctx.lineWidth = 3;
          ctx.strokeStyle = "white";
          ctx.shadowColor = " white";
          ctx.shadowBlur = "39";

          ctx.beginPath();
          ctx.moveTo(120 + x, 100 + y);
          ctx.bezierCurveTo(
            320 + x,
            20 + y,
            140 + 100 * Math.sin((time * 1) / 100) + x,
            20 + y,
            130 + x,
            40 + y
          );
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(120 + x, 100 + y);
          ctx.bezierCurveTo(
            -100 + x,
            20 + y,
            140 + 100 * Math.sin((time * 1) / 100) + x,
            20 + y,
            130 + x,
            40 + y
          );
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(120 + x, 100 + y);
          ctx.bezierCurveTo(
            -20 + x,
            140 + y,
            120 + x,
            160 + y,
            120 + x,
            100 + y
          );
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(120 + x, 100 + y);
          ctx.bezierCurveTo(
            250 + x,
            140 + y,
            150 + x,
            160 + y,
            120 + x,
            100 + y
          );
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(125 + x, 90 + y, 5, 60, Math.PI / 20, 0, 2 * Math.PI);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(135 + x, 30 + y);
          ctx.lineTo(150 + x, 5 + y);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(135 + x, 30 + y);
          ctx.lineTo(125 + x, 5 + y);
          ctx.stroke();
          ctx.fillStyle = "black";
          ctx.beginPath();
          ctx.moveTo(120 + x, 100 + y);
          ctx.bezierCurveTo(
            300 + x,
            20 + y,
            140 + 100 * Math.sin((time * 1) / 100) + x,
            20 + y + 10 * Math.sin((time * 1) / 100),
            130 + x,
            40 + y
          );
          ctx.fill();

          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(120 + x, 100 + y);
          ctx.bezierCurveTo(
            -80 + x,
            20 + y,
            140 + 100 * Math.sin((time * 1) / 100) + x,
            20 + y,
            130 + x,
            40 + y
          );
          ctx.fill();
          ctx.moveTo(120 + x, 100 + y);
          ctx.bezierCurveTo(
            -6 + x,
            140 + y,
            120 + x,
            160 + y,
            120 + x,
            100 + y
          );
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(120 + x, 100 + y);
          ctx.bezierCurveTo(
            230 + x,
            140 + y,
            150 + x,
            160 + y,
            120 + x,
            100 + y
          );
          ctx.fill();

          // Second Butterfly
          let x2 = innerWidth - (400 * Math.pow(Math.sin((time * 1) / 1000), 2) + 150);
          let y2 = 150;
          ctx.lineWidth = 3;
          ctx.strokeStyle = "white";
          ctx.shadowColor = " white";
          ctx.shadowBlur = "39";

          ctx.beginPath();
          ctx.moveTo(120 + x2, 100 + y2);
          ctx.bezierCurveTo(
            320 + x2,
            20 + y2,
            140 + 100 * Math.sin((time * 1) / 100) + x2,
            20 + y2,
            130 + x2,
            40 + y2
          );
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(120 + x2, 100 + y2);
          ctx.bezierCurveTo(
            -100 + x2,
            20 + y2,
            140 + 100 * Math.sin((time * 1) / 100) + x2,
            20 + y2,
            130 + x2,
            40 + y2
          );
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(120 + x2, 100 + y2);
          ctx.bezierCurveTo(
            -20 + x2,
            140 + y2,
            120 + x2,
            160 + y2,
            120 + x2,
            100 + y2
          );
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(120 + x2, 100 + y2);
          ctx.bezierCurveTo(
            250 + x2,
            140 + y2,
            150 + x2,
            160 + y2,
            120 + x2,
            100 + y2
          );
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(125 + x2, 90 + y2, 5, 60, Math.PI / 20, 0, 2 * Math.PI);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(135 + x2, 30 + y2);
          ctx.lineTo(150 + x2, 5 + y2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(135 + x2, 30 + y2);
          ctx.lineTo(125 + x2, 5 + y2);
          ctx.stroke();
          ctx.fillStyle = "black";
          ctx.beginPath();
          ctx.moveTo(120 + x2, 100 + y2);
          ctx.bezierCurveTo(
            300 + x2,
            20 + y2,
            140 + 100 * Math.sin((time * 1) / 100) + x2,
            20 + y2 + 10 * Math.sin((time * 1) / 100),
            130 + x2,
            40 + y2
          );
          ctx.fill();

          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(120 + x2, 100 + y2);
          ctx.bezierCurveTo(
            -80 + x2,
            20 + y2,
            140 + 100 * Math.sin((time * 1) / 100) + x2,
            20 + y2,
            130 + x2,
            40 + y2
          );
          ctx.fill();
          ctx.moveTo(120 + x2, 100 + y2);
          ctx.bezierCurveTo(
            -6 + x2,
            140 + y2,
            120 + x2,
            160 + y2,
            120 + x2,
            100 + y2
          );
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(120 + x2, 100 + y2);
          ctx.bezierCurveTo(
            230 + x2,
            140 + y2,
            150 + x2,
            160 + y2,
            120 + x2,
            100 + y2
          );
          ctx.fill();

          for (let p of particles) {
            if (!p.returning) {
              p.vx *= FRICTION;
              p.vy *= FRICTION;
              p.x += p.vx;
              p.y += p.vy;
            } else {
              const ax = (p.homeX - p.x) * SPRING;
              const ay = (p.homeY - p.y) * SPRING;
              p.vx = (p.vx + ax) * DAMPING;
              p.vy = (p.vy + ay) * DAMPING;
              p.x += p.vx;
              p.y += p.vy;

              if (
                Math.abs(p.x - p.homeX) < 0.5 &&
                Math.abs(p.y - p.homeY) < 0.5 &&
                Math.abs(p.vx) < 0.3 &&
                Math.abs(p.vy) < 0.3
              ) {
                p.x = p.homeX;
                p.y = p.homeY;
                p.vx = (Math.random() - 0.5) * 2;
                p.vy = (Math.random() - 0.5) * 2;
              }
            }

            // Alpha-Wert für Blinken berechnen
            const alpha =
              0.5 + 0.5 * Math.sin(time * p.blinkSpeed + p.blinkOffset);

            ctx.beginPath();
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.shadowColor = " white";
            ctx.shadowBlur = "40";
            ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
            ctx.fill();
          }

          requestAnimationFrame(animate);
        }

        animate();
      })();
    </script>

  </body>
</html>
